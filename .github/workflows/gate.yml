# The merge gate (TASK-002).
#
# cicd-pipeline.md defines six stages. This workflow implements the first two; the rest need
# a generated workspace, which does not exist yet:
#
#   stage 1  shape of the plugin itself     FF-001, FF-002, FF-009   <- here
#            library integrity              FF-017                   <- here
#   stage 2  unit and integration tests                              <- here
#   stage 3  generate golden workspaces     ci/generate-workspace.mjs  <- built, NOT wired
#   stage 4  walk the golden workspaces     FF-004..FF-008, FF-010..FF-014
#   stage 5  end-to-end, including resume x8 (FF-003)                TASK-007
#   stage 6  eval scorers                                            TASK-016
#
# STAGE 3 EXISTS AND IS DELIBERATELY NOT A STEP BELOW. `node ci/generate-workspace.mjs EV-001`
# drives a real intake from an answer record and compares what it produces against the golden
# workspace. It needs a network, a host and money, and nobody has yet measured how much its
# result varies between runs. A gate whose pass rate is unknown does not block bad merges; it
# blocks arbitrary ones, and gets waved through by the second week. Wiring it in now would be
# BR-009 — a success claim on an unmeasured check — committed by the tool built to catch it.
# It becomes a step when there is a baseline to compare against (TASK-016 step 6).
#
# The scheduled install test (RISK-004's only detector) is decided as WEEKLY but not built
# here: it installs the PUBLISHED plugin, and nothing is published yet.
#
# A warning is not a gate. Every step below either passes or fails the build.

name: gate

on:
  pull_request:
  push:
    branches: [main]
  # MANUALLY RUNNABLE, deliberately. On 2026-08-06 GitHub Actions had a major outage and
  # stopped creating runs at all: the workflow was active, the PR was open, the commit was on
  # GitHub, and zero runs existed. `gate` is a required status check, so nothing could merge
  # for hours - not because anything failed, but because nothing could be asked to run.
  #
  # A gate with no way to trigger it by hand is one outage away from blocking every merge, and
  # the only way out is to weaken branch protection under time pressure, which is when weakening
  # it is least wise. This costs nothing and removes that.
  #
  # It does NOT weaken the gate: a manual run executes exactly the same steps and reports the
  # same check. It changes who can ask, never what is asked.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FF-002 compares this branch against its merge base. A shallow clone has no base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Cheapest checks first: a structural violation should fail in seconds, not after
      # generating 36 workspaces. All three run even when one fails, so a single log shows
      # every violation rather than only the first.
      - name: Stage 1 — shape of the plugin itself (FF-001, FF-002, FF-009, FF-017)
        run: |
          failed=0
          for check in \
            ci/ff-001-single-command.mjs \
            ci/ff-002-module-independence.mjs \
            ci/ff-009-no-executable-payload.mjs \
            ci/ff-017-blueprint-integrity.mjs
          do
            echo "::group::$check"
            node "$check" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # A GLOB THAT MATCHES NOTHING IS NOT A PASS. `node --test "tests/**/*.nomatch"` prints
      # `# tests 0` and exits 0 — verified on this pinned runtime. So a renamed directory, a
      # changed extension, or a runner that stopped expanding this pattern would turn the one
      # step standing behind GOLD-001 and every unit and integration test green while running
      # nothing, and the log would say `pass 0` where a reader expects a number.
      #
      # That is the same defect the tests in this suite exist to catch — a check reporting
      # success having judged nothing — committed by the gate itself, and it has a third
      # outcome where the comment at the top of this file promises two.
      #
      # The TAP stream goes to a file so the count is parsed from a stable format; the spec
      # reporter still goes to the log so a human reads what they always did.
      - name: Stage 2 — unit and integration tests
        run: |
          set -euo pipefail
          node --test \
            --test-reporter=tap --test-reporter-destination=stage2.tap \
            --test-reporter=spec --test-reporter-destination=stdout \
            "tests/**/*.mjs"
          ran=$(sed -n 's/^# tests \([0-9]\+\)$/\1/p' stage2.tap | tail -1)
          if [ -z "$ran" ]; then
            echo "::error::stage 2 produced no TAP summary — the count could not be read, so nothing is claimed"
            exit 1
          fi
          echo "stage 2 collected $ran test(s)"
          if [ "$ran" -eq 0 ]; then
            echo "::error::stage 2 ran ZERO tests. The glob tests/**/*.mjs matched nothing. A test stage that is green because it found no tests is not a pass."
            exit 1
          fi

  # CON-004 says the kit behaves identically on Windows, macOS and Linux, and until now nothing
  # checked it. That was not theoretical: BUG-027 shipped a Step 0 that named only `sha256sum`
  # and `shasum`, both POSIX, so on a Windows host without Git Bash the mandatory integrity
  # check could not run and the kit stopped before question one. Every trace that missed it ran
  # on a Windows machine that happened to have Git Bash.
  #
  # This runs each platform's OWN documented command, on that platform, against the real
  # library, and requires all three to produce the digest the manifest declares. One expected
  # value, three ways of reaching it — so a command that stops working, or drifts from the
  # others, fails here rather than in front of a developer.
  #
  # NOT part of `gate`. It is a separate job so that three runners are not on the critical path
  # of every merge, and it is not a required status check until someone decides it should be.
  platforms:
    name: Step 0 runs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: The digest the manifest declares
        id: want
        shell: bash
        run: |
          set -euo pipefail
          want=$(sed -n 's/^\*\*Library digest:\*\* `\([0-9a-f]\{64\}\)`.*/\1/p' plugin/blueprints/MANIFEST.md | head -1)
          if [ -z "$want" ]; then
            echo "::error::no Library digest line in MANIFEST.md — nothing to compare against, so nothing is claimed"
            exit 1
          fi
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "manifest declares $want"

      - name: POSIX form (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: plugin/blueprints
        run: |
          set -euo pipefail
          got=$(sha256sum *.md */*.md */*/*.md */*/*/*.md | grep -v MANIFEST | cut -c1-64 | sort | sha256sum | cut -c1-64)
          echo "sha256sum form -> $got"
          [ "$got" = "${{ steps.want.outputs.want }}" ] || { echo "::error::Linux Step 0 disagrees with the manifest"; exit 1; }

      - name: macOS form
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: plugin/blueprints
        run: |
          set -euo pipefail
          got=$(shasum -a 256 *.md */*.md */*/*.md */*/*/*.md | grep -v MANIFEST | cut -c1-64 | sort | shasum -a 256 | cut -c1-64)
          echo "shasum form -> $got"
          [ "$got" = "${{ steps.want.outputs.want }}" ] || { echo "::error::macOS Step 0 disagrees with the manifest"; exit 1; }

      # PowerShell, not bash — the whole point is that this host may have no POSIX shell at all.
      - name: Windows form
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: plugin/blueprints
        run: |
          $h = Get-ChildItem -Recurse -Filter *.md | Where-Object { $_.Name -ne 'MANIFEST.md' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() } | Sort-Object
          $b = [Text.Encoding]::UTF8.GetBytes(($h -join "`n") + "`n")
          $got = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($b)) -replace '-','').ToLower()
          Write-Host "PowerShell form -> $got"
          if ($got -ne '${{ steps.want.outputs.want }}') { Write-Host "::error::Windows Step 0 disagrees with the manifest"; exit 1 }
